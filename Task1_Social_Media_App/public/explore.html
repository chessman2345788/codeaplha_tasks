<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SocialApp — Explore</title>
  <meta name="description" content="Discover people on SocialApp."/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/router.js"></script>
</head>
<body data-require-auth>

  <div class="app-layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar sidebar-left">
      <a href="feed.html" class="sidebar-logo">
        <div class="logo-icon"><i class="fa-solid fa-shapes"></i></div>
        <span class="logo-text">Social</span>
      </a>
      <nav class="sidebar-nav">
        <a href="feed.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
        <a href="explore.html" class="nav-link active"><i class="fa-solid fa-compass"></i> Explore</a>
        <a href="notifications.html" class="nav-link"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="messages.html" class="nav-link"><i class="fa-solid fa-envelope"></i> Messages</a>
        <a href="profile.html" class="nav-link"><i class="fa-regular fa-user"></i> Profile</a>
      </nav>
      <div class="sidebar-bottom">
        <button id="theme-toggle" class="nav-link" style="background:none;border:none;cursor:pointer;width:100%;text-align:left;">
          <i class="fa-solid fa-moon"></i> Theme
        </button>
        <button data-logout class="nav-link logout-btn" style="background:none;border:none;cursor:pointer;width:100%;text-align:left;">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out
        </button>
      </div>
    </aside>

    <!-- MOBILE TOP BAR -->
    <header class="mobile-topbar">
      <a href="feed.html" class="mobile-logo">
        <div class="logo-icon sm"><i class="fa-solid fa-shapes"></i></div>
      </a>
      <button id="theme-toggle-mobile" class="icon-action-btn"><i class="fa-solid fa-moon"></i></button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="feed-main">
      <div class="page-header">
        <h1 class="page-title">Explore</h1>
        <p class="page-subtitle">Discover people on SocialApp</p>
      </div>

      <!-- Search -->
      <div class="search-wrap" style="margin-bottom:24px;">
        <i class="fa-solid fa-magnifying-glass search-icon-inner"></i>
        <input type="text" id="explore-search" placeholder="Search users..." class="search-field"/>
      </div>

      <div id="users-container">
        <!-- skeleton -->
        <div class="user-skeleton"></div>
        <div class="user-skeleton"></div>
        <div class="user-skeleton"></div>
      </div>
    </main>

  </div>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-bottom-nav">
    <a href="feed.html" class="mob-nav-item"><i class="fa-solid fa-house"></i></a>
    <a href="explore.html" class="mob-nav-item active"><i class="fa-solid fa-compass"></i></a>
    <a href="notifications.html" class="mob-nav-item"><i class="fa-solid fa-bell"></i></a>
    <a href="messages.html" class="mob-nav-item"><i class="fa-solid fa-envelope"></i></a>
    <a href="profile.html" class="mob-nav-item"><i class="fa-regular fa-user"></i></a>
  </nav>

  <div id="toast"></div>

  <script src="js/theme.js"></script>
  <script>
    document.getElementById('theme-toggle-mobile')?.addEventListener('click', () =>
      document.getElementById('theme-toggle')?.click()
    );

    var myUserId = localStorage.getItem('userId');
    var allUsers = [];

    function showToast(msg, type) {
      var t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.className = 'toast-visible toast-' + (type || 'success');
      clearTimeout(t._timer);
      t._timer = setTimeout(function () { t.className = ''; }, 3200);
    }

    function escapeHTML(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderUsers(users) {
      var c = document.getElementById('users-container');
      if (!users.length) {
        c.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><p class="empty-msg">No users found.</p></div>';
        return;
      }
      c.innerHTML = users.map(function(u) {
        var isMe = u._id === myUserId;
        return (
          '<div class="user-card">' +
            '<a href="profile.html?id=' + u._id + '" class="user-card-avatar">' +
              (u.username ? u.username[0].toUpperCase() : '?') +
            '</a>' +
            '<div class="user-card-info">' +
              '<a href="profile.html?id=' + u._id + '" class="user-card-name">@' + escapeHTML(u.username) + '</a>' +
              '<p class="user-card-bio">' + (u.bio ? escapeHTML(u.bio.substring(0,80)) + (u.bio.length > 80 ? '…' : '') : 'No bio yet') + '</p>' +
            '</div>' +
            (!isMe
              ? '<a href="profile.html?id=' + u._id + '" class="btn btn-primary" style="font-size:.82rem;padding:7px 18px;">View</a>'
              : '<span class="user-card-you">You</span>'
            ) +
          '</div>'
        );
      }).join('');
    }

    async function loadUsers() {
      try {
        var res = await fetch('/api/users');
        allUsers = await res.json();
        renderUsers(allUsers);
      } catch(e) {
        document.getElementById('users-container').innerHTML =
          '<div class="empty-state"><div class="empty-icon">⚠️</div><p class="empty-msg">Could not load users.</p></div>';
      }
    }

    document.getElementById('explore-search').addEventListener('input', function(e) {
      var term = e.target.value.toLowerCase().trim();
      if (!term) { renderUsers(allUsers); return; }
      renderUsers(allUsers.filter(function(u) {
        return u.username && u.username.toLowerCase().includes(term);
      }));
    });

    loadUsers();
  </script>
</body>
</html>
