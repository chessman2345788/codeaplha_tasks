<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SocialApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #0095f6;
      --accent:  #833ab4;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* ── Splash container ── */
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      opacity: 0;
      transform: scale(0.88);
      animation: splashIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    /* ── Logo Icon ── */
    .splash-icon {
      width: 90px;
      height: 90px;
      border-radius: 26px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      display: grid;
      place-items: center;
      font-size: 2.6rem;
      position: relative;
      box-shadow: 0 0 0 0 rgba(0, 149, 246, 0.6);
      animation: iconPulse 2s ease-in-out 0.8s infinite;
    }

    /* ── Wordmark ── */
    .splash-wordmark {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.55));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Progress bar ── */
    .splash-bar-track {
      width: 80px;
      height: 2px;
      background: rgba(255,255,255,0.12);
      border-radius: 99px;
      overflow: hidden;
    }

    .splash-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 99px;
      animation: barFill 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
    }

    /* ── Tagline ── */
    .splash-tagline {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.04em;
      animation: fadeIn 0.6s ease 1s both;
    }

    /* ── Page exit (fade to white/black) ── */
    .splash-exit {
      animation: splashOut 0.5s cubic-bezier(0.4, 0, 1, 1) forwards !important;
    }

    /* ── Keyframes ── */
    @keyframes splashIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1);    }
    }
    @keyframes splashOut {
      from { opacity: 1; transform: scale(1);    }
      to   { opacity: 0; transform: scale(1.06); }
    }
    @keyframes iconPulse {
      0%, 100% { box-shadow: 0 0 0 0   rgba(0,149,246,0.5); }
      50%       { box-shadow: 0 0 0 18px rgba(0,149,246,0);   }
    }
    @keyframes barFill {
      to { width: 100%; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="splash" id="splash">
    <div class="splash-icon">✦</div>
    <div class="splash-wordmark">SocialApp</div>
    <div class="splash-bar-track">
      <div class="splash-bar-fill"></div>
    </div>
    <div class="splash-tagline">Share your world</div>
  </div>

  <script>
    // After bar animation finishes (≈2.3s), decide where to go
    setTimeout(() => {
      const el   = document.getElementById('splash');
      const dest = localStorage.getItem('userId') ? 'feed.html' : 'index.html';

      // Fade out then navigate
      el.classList.add('splash-exit');
      setTimeout(() => { window.location.href = dest; }, 480);
    }, 2300);
  </script>

</body>
</html>
