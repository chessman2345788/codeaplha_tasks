<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SocialApp — Profile</title>
  <meta name="description" content="View and manage your SocialApp profile."/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/router.js"></script>
</head>
<body data-require-auth>

  <div class="app-layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar sidebar-left">
      <a href="feed.html" class="sidebar-logo">
        <div class="logo-icon"><i class="fa-solid fa-shapes"></i></div>
        <span class="logo-text">Social</span>
      </a>
      <nav class="sidebar-nav">
        <a href="feed.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
        <a href="explore.html" class="nav-link"><i class="fa-solid fa-compass"></i> Explore</a>
        <a href="notifications.html" class="nav-link"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="messages.html" class="nav-link"><i class="fa-solid fa-envelope"></i> Messages</a>
        <a href="profile.html" class="nav-link active"><i class="fa-regular fa-user"></i> Profile</a>
      </nav>
      <div class="sidebar-bottom">
        <button id="theme-toggle" class="nav-link" style="background:none;border:none;cursor:pointer;width:100%;text-align:left;">
          <i class="fa-solid fa-moon"></i> Theme
        </button>
        <button data-logout class="nav-link logout-btn" style="background:none;border:none;cursor:pointer;width:100%;text-align:left;">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out
        </button>
      </div>
    </aside>

    <!-- MOBILE TOP BAR -->
    <header class="mobile-topbar">
      <a href="feed.html" class="mobile-logo">
        <div class="logo-icon sm"><i class="fa-solid fa-shapes"></i></div>
        <span style="font-weight:700;font-size:1rem;">Profile</span>
      </a>
      <div class="mobile-topbar-actions">
        <button id="theme-toggle-mobile" class="icon-action-btn"><i class="fa-solid fa-moon"></i></button>
        <button data-logout class="icon-action-btn" style="color:var(--danger)"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="feed-main" style="max-width:680px;">

      <!-- Profile card — populated by profile.js -->
      <div id="profile-card" class="post-card" style="margin-bottom:24px;overflow:hidden;">
        <!-- skeleton -->
        <div style="height:120px;background:linear-gradient(135deg,#e2e8f0,#cbd5e0);"></div>
        <div style="padding:0 20px 20px;">
          <div class="sk-circle" style="width:80px;height:80px;margin-top:-40px;border:4px solid var(--surface);"></div>
          <div class="sk-lines" style="margin-top:12px;">
            <div class="sk-line" style="width:40%;height:16px;"></div>
            <div class="sk-line" style="width:60%;height:12px;margin-top:8px;"></div>
          </div>
        </div>
      </div>

      <h2 id="posts-heading" class="hidden" style="font-size:1.1rem;font-weight:800;color:var(--text);margin-bottom:16px;padding-left:4px;">Posts</h2>
      <div id="user-posts-container"></div>

    </main>

  </div>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-bottom-nav">
    <a href="feed.html" class="mob-nav-item"><i class="fa-solid fa-house"></i></a>
    <a href="explore.html" class="mob-nav-item"><i class="fa-solid fa-compass"></i></a>
    <a href="notifications.html" class="mob-nav-item"><i class="fa-solid fa-bell"></i></a>
    <a href="messages.html" class="mob-nav-item"><i class="fa-solid fa-envelope"></i></a>
    <a href="profile.html" class="mob-nav-item active"><i class="fa-regular fa-user"></i></a>
  </nav>

  <!-- Edit Profile Modal -->
  <div id="edit-profile-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Edit Profile</h3>
        <button id="close-modal-btn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="edit-bio">Bio</label>
          <textarea
            id="edit-bio"
            rows="4"
            placeholder="Tell us about yourself…"
            maxlength="160"
            style="width:100%;padding:11px 14px;background:var(--surface-2);border:1.5px solid var(--border-2);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:.9rem;resize:none;outline:none;transition:border-color .18s;"
          ></textarea>
          <div id="bio-char-count" style="text-align:right;font-size:.75rem;color:var(--muted);margin-top:4px;">0 / 160</div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancel-edit-btn" class="btn btn-outline">Cancel</button>
        <button id="save-profile-btn" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/theme.js"></script>
  <script src="js/profile.js"></script>
  <script>
    document.getElementById('theme-toggle-mobile')?.addEventListener('click', () =>
      document.getElementById('theme-toggle')?.click()
    );
  </script>
</body>
</html>
