<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SocialApp — Create Account</title>
  <meta name="description" content="Create your free SocialApp account today."/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/router.js"></script>
</head>
<body data-require-guest>

  <div class="auth-layout">

    <!-- Branding panel (desktop) -->
    <div class="auth-brand">
      <i class="fa-solid fa-shapes auth-brand-icon"></i>
      <h1 class="auth-brand-title">SocialApp</h1>
      <p class="auth-brand-desc">Join us today and discover a world of possibilities.</p>
    </div>

    <!-- Form panel -->
    <div class="auth-form-panel">
      <div class="auth-logo">
        <div class="auth-logo-icon"><i class="fa-solid fa-shapes"></i></div>
        <span class="auth-logo-text">SocialApp</span>
        <p class="auth-tagline">Create your free account</p>
      </div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="yourhandle" required autocomplete="username" minlength="3"/>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email"/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" required autocomplete="new-password" minlength="6"/>
        </div>
        <button id="register-btn" type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>

      <p class="auth-footer-text">
        Already have an account?
        <a href="index.html" class="auth-link">Sign in</a>
      </p>
    </div>

  </div>

  <div id="toast"></div>

  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
