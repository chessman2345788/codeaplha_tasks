<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SocialApp — Messages</title>
  <meta name="description" content="Direct messages on SocialApp."/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/router.js"></script>
</head>
<body data-require-auth>

  <div class="app-layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar sidebar-left">
      <a href="feed.html" class="sidebar-logo">
        <div class="logo-icon"><i class="fa-solid fa-shapes"></i></div>
        <span class="logo-text">Social</span>
      </a>
      <nav class="sidebar-nav">
        <a href="feed.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
        <a href="explore.html" class="nav-link"><i class="fa-solid fa-compass"></i> Explore</a>
        <a href="notifications.html" class="nav-link"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="messages.html" class="nav-link active"><i class="fa-solid fa-envelope"></i> Messages</a>
        <a href="profile.html" class="nav-link"><i class="fa-regular fa-user"></i> Profile</a>
      </nav>
      <div class="sidebar-bottom">
        <button id="theme-toggle" class="nav-link" style="background:none;border:none;cursor:pointer;width:100%;text-align:left;">
          <i class="fa-solid fa-moon"></i> Theme
        </button>
        <button data-logout class="nav-link logout-btn" style="background:none;border:none;cursor:pointer;width:100%;text-align:left;">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out
        </button>
      </div>
    </aside>

    <!-- MOBILE TOP BAR -->
    <header class="mobile-topbar">
      <a href="feed.html" class="mobile-logo">
        <div class="logo-icon sm"><i class="fa-solid fa-shapes"></i></div>
      </a>
      <button id="theme-toggle-mobile" class="icon-action-btn"><i class="fa-solid fa-moon"></i></button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="feed-main">
      <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <h1 class="page-title">Messages</h1>
          <p class="page-subtitle">Your private conversations</p>
        </div>
        <button class="btn btn-primary" style="font-size:.82rem;padding:8px 16px;">
          <i class="fa-solid fa-plus"></i> New
        </button>
      </div>

      <div class="empty-state" style="margin-top:16px;">
        <div class="empty-icon">
          <i class="fa-regular fa-paper-plane" style="font-size:3rem;color:var(--primary)"></i>
        </div>
        <p class="empty-msg">Welcome to your inbox!</p>
        <p style="font-size:.875rem;color:var(--muted);margin-top:8px;max-width:320px;margin-left:auto;margin-right:auto;line-height:1.6;">
          Drop a line, share posts and more with private conversations between you and others on SocialApp.
        </p>
        <button class="btn btn-primary" style="margin-top:20px;">Write a message</button>
      </div>
    </main>

  </div>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-bottom-nav">
    <a href="feed.html" class="mob-nav-item"><i class="fa-solid fa-house"></i></a>
    <a href="explore.html" class="mob-nav-item"><i class="fa-solid fa-compass"></i></a>
    <a href="notifications.html" class="mob-nav-item"><i class="fa-solid fa-bell"></i></a>
    <a href="messages.html" class="mob-nav-item active"><i class="fa-solid fa-envelope"></i></a>
    <a href="profile.html" class="mob-nav-item"><i class="fa-regular fa-user"></i></a>
  </nav>

  <div id="toast"></div>

  <script src="js/theme.js"></script>
  <script>
    document.getElementById('theme-toggle-mobile')?.addEventListener('click', () =>
      document.getElementById('theme-toggle')?.click()
    );
  </script>
</body>
</html>
